name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore GymmanagmentSystem.slnx

    - name: Build solution
      run: dotnet build GymmanagmentSystem.slnx --configuration Release --no-restore

    - name: Run tests
      run: dotnet test GymmanagmentSystem.slnx --configuration Release --no-build --verbosity normal
