name: .NET Core CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Test (.NET 9.0)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore Dependencies
      run: dotnet restore GymmanagmentSystem.slnx

    - name: Build Solution
      run: dotnet build GymmanagmentSystem.slnx --configuration Release --no-restore

    - name: Run Tests
      run: dotnet test GymmanagmentSystem.slnx --configuration Release --no-build --verbosity normal
